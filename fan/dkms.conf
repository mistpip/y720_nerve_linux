PACKAGE_NAME="y720-cooling"
y720_source_dir=$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")
PACKAGE_VERSION=$(cat "$y720_source_dir/VERSION" 2>/dev/null || cat "$y720_source_dir/../VERSION")
BUILT_MODULE_NAME[0]="y720_cooling"
BUILT_MODULE_LOCATION[0]="kernel"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C kernel KDIR=/lib/modules/${kernelver}/build"
if grep -q '^CONFIG_CC_IS_CLANG=y' "/lib/modules/${kernelver}/build/.config"; then
    MAKE[0]="${MAKE[0]} LLVM=1"
fi
AUTOINSTALL="no"
